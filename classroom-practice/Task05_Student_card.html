<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card{
            width: 350px;
            background-color: white;
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
        }

        .circle{
            width: 120px;
            height: 120px;
            background-color: #e6d6d6;
            border-radius: 50%;
            margin: auto;
            line-height: 120px;
            font-size: 22px;
        }

        h1{
            margin-top: 20px;
        }

        .branch{
            font-size: 24px;
            font-weight: bold;
        }

        .college{
            font-size: 20px;
            color: gray;
        }

        p{
            font-size: 20px;
            line-height: 1.6;
        }

        .skills{
            font-weight: bold;
            font-size: 24px;
        }

        button{
            background-color: royalblue;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="circle">Student</div>

        <h1>Harshita Sharma</h1>

        <div class="branch">Computer Science Engineering</div>

        <div class="college">GLA University</div>

        <p>
            I am a passionate Computer Science
            student interested in Web Development,
            Java, and problem solving.
        </p>

        <div class="skills">Skills</div>

        <p>HTML, CSS, Java, Problem Solving</p>

        <button>Contact Me</button>
    </div>

</body>
</html>
