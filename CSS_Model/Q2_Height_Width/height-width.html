<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="height-width.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main>
        <section class="box-container">

            <!-- Box using px -->
            <div class="box box-one">
                <h2>Box 1</h2>
                <p>Height: 150px</p>
                <p>Width: 200px</p>
            </div>

            <!-- Box using percentage -->
            <div class="box box-two">
                <h2>Box 2</h2>
                <p>Width: 30%</p>
            </div>

            <!-- Box using vh and em -->
            <div class="box box-three">
                <h2>Box 3</h2>
                <p>Height: 25vh</p>
                <p>Width: 15em</p>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Harshita Sharma</p>
    </footer>

</body>
</html>
