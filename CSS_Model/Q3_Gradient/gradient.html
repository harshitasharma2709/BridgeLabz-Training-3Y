<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="gradient.css">
</head>
<body>

    <!-- Fixed Header -->
    <header>
        <h1>Gradient Background Page</h1>
    </header>

    <main>

        <!-- Linear Gradient Section -->
        <section class="linear-section">
            <h2>Linear Gradient</h2>
            <p>
                This section demonstrates a linear gradient
                background that changes smoothly from one color
                to another.
            </p>
        </section>

        <!-- Radial Gradient Section -->
        <section class="radial-section">
            <h2>Radial Gradient</h2>
            <p>
                This section demonstrates a radial gradient
                spreading outward from the center.
            </p>
        </section>

    </main>

    <!-- Fixed Footer -->
