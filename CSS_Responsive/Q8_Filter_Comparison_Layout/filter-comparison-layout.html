<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>

<body>

    <header>
        <h1>Filter Comparison</h1>
        <p>Before and After CSS Filter</p>
    </header>

    <main>

        <section class="comparison">

            <!-- Original image -->
            <figure>
                <img src="https://picsum.photos/500/350?random=20"
                     alt="Original image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <!-- Filtered image -->
            <figure>
                <img src="https://picsum.photos/500/350?random=20"
                     alt="Filtered image"
                     class="filtered">
                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Filter Comparison</p>
    </footer>

</body>
</html>
