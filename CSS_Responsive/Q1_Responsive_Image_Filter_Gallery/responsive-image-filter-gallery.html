<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Explore different CSS image filters</p>
    </header>

    <main>
        <section class="gallery">

            <!-- Blur -->
            <figure class="gallery-card">
                <img src="https://picsum.photos/400/280?random=1"
                     alt="Nature image"
                     class="blur">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <!-- Grayscale -->
            <figure class="gallery-card">
                <img src="https://picsum.photos/400/280?random=2"
                     alt="City image"
                     class="grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <!-- Sepia -->
            <figure class="gallery-card">
                <img src="https://picsum.photos/400/280?random=3"
                     alt="Mountain image"
                     class="sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <!-- Brightness -->
            <figure class="gallery-card">
                <img src="https://picsum.photos/400/280?random=4"
                     alt="Beach image"
                     class="brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <!-- Contrast -->
            <figure class="gallery-card">
                <img src="https://picsum.photos/400/280?random=5"
                     alt="Forest image"
                     class="contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <!-- Hue Rotate -->
            <figure class="gallery-card">
                <img src="https://picsum.photos/400/280?random=6"
                     alt="Lake image"
                     class="hue">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Image Filter Gallery</p>
    </footer>

</body>
</html>
