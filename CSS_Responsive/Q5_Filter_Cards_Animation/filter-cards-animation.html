<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>

<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>

        <section class="profiles">

            <article class="profile-card">
                <img src="https://i.pravatar.cc/300?img=12"
                     alt="Profile of Alex"
                     class="grayscale">

                <h2>Stark</h2>
                <p>Frontend Developer</p>
            </article>

            <article class="profile-card">
                <img src="https://i.pravatar.cc/300?img=32"
                     alt="Profile of Sarah"
                     class="sepia">

                <h2>Tiny</h2>
                <p>UI/UX Designer</p>
            </article>

            <article class="profile-card">
                <img src="https://i.pravatar.cc/300?img=56"
                     alt="Profile of John"
                     class="grayscale">

                <h2>John</h2>
                <p>Data Analyst</p>
            </article>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Profile Cards</p>
    </footer>

</body>
</html>
