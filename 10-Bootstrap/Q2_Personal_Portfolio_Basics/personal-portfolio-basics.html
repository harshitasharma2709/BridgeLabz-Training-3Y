<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harshita Sharma - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href=".\personal-portfolio-basics.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-light text-dark text-center p-5">

        <h1 class="fw-bold">
            Harshita Sharma
        </h1>

        <p class="lead">
            B.Tech CSE | AI & Data Science
        </p>

        <p>
            GLA University, Mathura
        </p>

    </header>

    <main>

        <section class="container text-center mt-4 mb-3">

            <!-- Profile Image -->
            <img src="profile.jpg"
                 alt="Harshita Sharma"
                 class="img-fluid rounded-circle profile-img mb-4">

            <h2 class="fw-bold">
                About Me
            </h2>

            <p>
                I am a B.Tech Computer Science student interested in
                Artificial Intelligence, Data Science and Web Development.
            </p>

            <!-- Buttons -->
            <div class="my-4">

                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-primary">
                    Download CV
                </a>

            </div>

        </section>

        <!-- Contact Form -->
        <section class="container mb-5">

            <h2 class="text-center fw-bold mb-4">
                Contact Me
            </h2>

            <form class="mx-auto contact-form">

                <input type="text"
                       class="form-control mb-3"
                       placeholder="Your Name">

                <input type="email"
                       class="form-control mb-3"
                       placeholder="Your Email">

                <textarea class="form-control mb-3"
                          rows="4"
                          placeholder="Your Message"></textarea>

                <button type="submit"
                        class="btn btn-primary">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 Harshita Sharma
        </p>
    </footer>

</body>
</html>
