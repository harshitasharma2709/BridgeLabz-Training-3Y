<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova - Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="company-landing-page.css">
</head>

<body>

    <!-- Header and Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">
                    TechNova
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <main>

        <!-- Hero Section -->
        <section class="hero py-5">
            <div class="container">

                <!-- Bootstrap row and columns -->
                <div class="row align-items-center">

                    <div class="col-lg-8 text-center text-lg-start">

                        <h1 class="display-4 fw-bold">
                            Build Your Future With Technology
                        </h1>

                        <p class="lead my-4">
                            TechNova provides simple and innovative digital
                            solutions for modern businesses.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg">
                            Get Started
                        </a>

                    </div>

                    <div class="col-lg-4 text-center mt-4 mt-lg-0">
                        <div class="hero-box">
                            💻
                        </div>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 TechNova. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
