<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href=".\product-catalog.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center py-4">
        <h1>Online Product Catalog</h1>
        <p class="mb-0">Find useful products at great prices</p>
    </header>

    <main class="container py-5">

        <section>

            <h2 class="text-center mb-4">
                Our Products
            </h2>

            <div class="row g-4">

                <!-- Product 1 -->
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://picsum.photos/400/250?random=1"
                             class="card-img-top"
                             alt="Laptop">

                        <div class="card-body text-center">
                            <h3 class="card-title h5">Laptop</h3>
                            <p class="fw-bold">₹55,000</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>
                    </article>
                </div>

                <!-- Product 2 -->
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://picsum.photos/400/250?random=2"
                             class="card-img-top"
                             alt="Smartphone">

                        <div class="card-body text-center">
                            <h3 class="card-title h5">Smartphone</h3>
                            <p class="fw-bold">₹25,000</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>
                    </article>
                </div>

                <!-- Product 3 -->
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://picsum.photos/400/250?random=3"
                             class="card-img-top"
                             alt="Headphones">

                        <div class="card-body text-center">
                            <h3 class="card-title h5">Headphones</h3>
                            <p class="fw-bold">₹2,000</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>
                    </article>
                </div>

                <!-- Product 4 -->
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card shadow-sm h-100">
                        <img src="https://picsum.photos/400/250?random=4"
                             class="card-img-top"
                             alt="Smartwatch">

                        <div class="card-body text-center">
                            <h3 class="card-title h5">Smartwatch</h3>
                            <p class="fw-bold">₹4,000</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>
                    </article>
                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Product Catalog</p>
    </footer>

</body>
</html>
