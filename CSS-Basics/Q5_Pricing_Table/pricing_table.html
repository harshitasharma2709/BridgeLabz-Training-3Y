<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="pricing_table.css">
</head>

<body>

    <main class="pricing">

        <h1>Choose Your Plan</h1>

        <section class="plans">

            <div class="plan">
                <h2>Basic</h2>
                <p class="price">₹499 / month</p>

                <ul>
                    <li>5 Projects</li>
                    <li>Basic Support</li>
                    <li>10 GB Storage</li>
                </ul>

                <a href="#">Choose Basic</a>
            </div>


            <div class="plan popular">
                <h2>Standard</h2>
                <p class="price">₹999 / month</p>

                <ul>
                    <li>15 Projects</li>
                    <li>Priority Support</li>
                    <li>50 GB Storage</li>
                </ul>

                <a href="#">Choose Standard</a>
            </div>


            <div class="plan">
                <h2>Premium</h2>
                <p class="price">₹1499 / month</p>

                <ul>
                    <li>Unlimited Projects</li>
                    <li>24/7 Support</li>
                    <li>100 GB Storage</li>
                </ul>

                <a href="#">Choose Premium</a>
            </div>

        </section>

    </main>

</body>
</html>
