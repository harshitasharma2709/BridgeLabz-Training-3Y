<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="photo_gallery.css">
</head>

<body>

    <main class="gallery-page">

        <h1>Travel Photo Gallery</h1>

        <section class="gallery">

            <figure class="photo">
                <img src="tt2.jpg"
                     alt="Mountain landscape">
                <figcaption>Mountain Escape</figcaption>
            </figure>

            <figure class="photo">
                <img src="tt1.jpg"
                     alt="Forest landscape">
                <figcaption>Peaceful Forest</figcaption>
            </figure>

            <figure class="photo">
                <img src="tt3.jpg"
                     alt="Nature landscape">
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure class="photo">
                <img src="tt4.jpg"
                     alt="Dog outdoors">
                <figcaption>Happy Companion</figcaption>
            </figure>

            <figure class="photo">
                <img src="tt5.jpg"
                     alt="Mountain and lake">
                <figcaption>Lake View</figcaption>
            </figure>

            <figure class="photo">
                <img src="tt6.jpg"
                     alt="Beach landscape">
                <figcaption>Beach Day</figcaption>
            </figure>

        </section>

    </main>

</body>
</html>
