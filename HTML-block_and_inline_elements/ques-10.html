<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>

<body>

    <h1>Harshita's Travel Preferences</h1>

    <form>

        <label for="country">Country:</label>
        <select id="country">
            <option selected>India</option>
            <option>USA</option>
            <option>Japan</option>
        </select>

        <br><br>

        <label for="state">State:</label>
        <select id="state">
            <option selected>Uttar Pradesh</option>
            <option>Maharashtra</option>
            <option>Karnataka</option>
        </select>

        <br><br>

        <label for="city">City:</label>
        <select id="city">
            <option selected>Mathura</option>
            <option>Delhi</option>
            <option>Mumbai</option>
        </select>

        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place">
            <option selected>Taj Mahal</option>
            <option>Red Fort</option>
            <option>Gateway of India</option>
        </select>

    </form>

    <p>
        You selected India, Uttar Pradesh, Mathura, and Taj Mahal.
    </p>

</body>
</html>
