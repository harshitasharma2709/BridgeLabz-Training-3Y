<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="transform.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
    </header>

    <main>
        <section class="transform-container">

            <!-- Rotate -->
            <article>
                <div class="box rotate-box">Rotate</div>
                <p>rotate()</p>
            </article>

            <!-- Scale -->
            <article>
                <div class="box scale-box">Scale</div>
                <p>scale()</p>
            </article>

            <!-- Translate -->
            <article>
                <div class="box translate-box">Move</div>
                <p>translate()</p>
            </article>

            <!-- Skew -->
            <article>
                <div class="box skew-box">Skew</div>
                <p>skew()</p>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Harshita Sharma</p>
    </footer>

</body>
</html>
