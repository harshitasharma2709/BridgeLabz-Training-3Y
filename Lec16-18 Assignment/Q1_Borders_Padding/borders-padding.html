<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="borders-padding.css">
</head>
<body>

    <!-- Page Header -->
    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>

    <main>
        <section class="box-container">

            <!-- Different border styles -->
            <div class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 10px</p>
            </div>

            <div class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 20px</p>
            </div>

            <div class="box double">
                <h2>Double Border</h2>
                <p>Padding: 30px</p>
            </div>

            <div class="box groove">
                <h2>Groove Border</h2>
                <p>Rounded Corners</p>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Harshita Sharma</p>
    </footer>

</body>
</html>
