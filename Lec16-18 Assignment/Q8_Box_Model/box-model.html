<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="box-model.css">
</head>
<body>

    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>
        <section class="box-model">

            <!-- Margin layer -->
            <div class="margin-layer">

                <!-- Border layer -->
                <div class="border-layer">

                    <!-- Padding layer -->
                    <div class="padding-layer">

                        <!-- Content layer -->
                        <div class="content-layer">
                            Content
                        </div>

                    </div>
                </div>
            </div>

            <p>
                The box model consists of content, padding,
                border, and margin.
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Harshita Sharma</p>
    </footer>

</body>
</html>
