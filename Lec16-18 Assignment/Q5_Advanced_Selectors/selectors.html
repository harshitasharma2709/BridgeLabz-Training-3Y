<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="selectors.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section class="items">
            <h2>Item List</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>Java</li>
                <li>Python</li>
            </ul>

            <!-- Attribute selector examples -->
            <input type="text" placeholder="Enter your name">

            <br><br>

            <a href="https://www.example.com">Secure Website</a>

            <div class="parent">
                <p>Direct child paragraph</p>
                <span>
                    <p>Descendant paragraph</p>
                </span>
            </div>

            <p class="sibling-one">First paragraph</p>
            <p class="sibling-two">Adjacent paragraph</p>
            <p class="sibling-three">General sibling paragraph</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Harshita Sharma</p>
    </footer>

</body>
</html>
