<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="card-flip.css">
</head>
<body>

    <!-- Flip Card -->
    <main class="container">

        <div class="card">

            <div class="card-front">
                <img src="profile.jpg" alt="Harshita Sharma">
                <h2>Harshita Sharma</h2>
            </div>

            <div class="card-back">
                <h2>About Me</h2>
                <p>
                    B.Tech Computer Science student at GLA University.
                    Interested in programming and web development.
                </p>
            </div>

        </div>

    </main>

</body>
</html>
