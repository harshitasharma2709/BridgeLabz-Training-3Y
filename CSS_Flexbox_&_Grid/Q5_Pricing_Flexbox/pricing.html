<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="pricing.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <main class="pricing">

        <section class="card">
            <h2>Basic</h2>
            <p class="price">₹499/month</p>
            <p>Basic features</p>
            <p>Email support</p>
            <button>Choose Plan</button>
        </section>

        <section class="card popular">
            <h2>Standard</h2>
            <p class="price">₹999/month</p>
            <p>All Basic features</p>
            <p>Priority support</p>
            <button>Choose Plan</button>
        </section>

        <section class="card">
            <h2>Premium</h2>
            <p class="price">₹1499/month</p>
            <p>All Standard features</p>
            <p>24/7 support</p>
            <button>Choose Plan</button>
        </section>

    </main>

</body>
</html>
