<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8-box-sizing.css">
</head>
<body>

    <header>
        <h1>Box-Sizing Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <!-- Default box sizing -->
            <article class="box default-box">
                <h2>Default Box-Sizing</h2>
                <p>
                    The default value is content-box.
                    Padding and border are added to the declared width.
                </p>
            </article>

            <!-- Border-box -->
            <article class="box border-box">
                <h2>Border-Box</h2>
                <p>
                    With border-box, padding and border are included
                    inside the declared width.
                </p>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Box Model Practice</p>
    </footer>

</body>
</html>
