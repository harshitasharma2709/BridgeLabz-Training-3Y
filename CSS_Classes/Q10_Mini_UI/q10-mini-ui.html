<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10-mini-ui.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Simple Contact UI</h1>
    </header>

    <main>

        <!-- Main content card -->
        <section class="main-card">

            <!-- Small image -->
            <img
                src="https://picsum.photos/150/150"
                alt="Profile image"
                class="profile-image"
            >

            <div class="form-section">

                <h2>Contact Us</h2>

                <!-- Form -->
                <form>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        rows="4"
                        placeholder="Enter your message"
                    ></textarea>

                    <!-- Buttons -->
                    <div class="buttons">
                        <button type="submit" class="submit-btn">
                            Submit
                        </button>

                        <button type="reset" class="reset-btn">
                            Reset
                        </button>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Harshita Sharma | Mini UI</p>
    </footer>

</body>
</html>
