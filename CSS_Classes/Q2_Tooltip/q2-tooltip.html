<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2-tooltip.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip-box">
                <span class="icon">★</span>
                <span class="tooltip-text">This is a Star</span>
            </div>

            <div class="tooltip-box">
                <span class="icon">?</span>
                <span class="tooltip-text">Help Information</span>
            </div>

            <div class="tooltip-box">
                <span class="icon">!</span>
                <span class="tooltip-text">Important Message</span>
            </div>

            <div class="tooltip-box">
                <span class="icon">✓</span>
                <span class="tooltip-text">Task Completed</span>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Practice</p>
    </footer>

</body>
</html>
