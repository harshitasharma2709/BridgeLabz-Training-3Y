<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3-image-showcase.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/250?random=1"
                         alt="Nature">
                </div>
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/250?random=2"
                         alt="Mountain">
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/250?random=3"
                         alt="City">
                </div>
                <figcaption>Modern City</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/250?random=4"
                         alt="Beach">
                </div>
                <figcaption>Peaceful Beach</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/250?random=5"
                         alt="Forest">
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/250?random=6"
                         alt="Lake">
                </div>
                <figcaption>Beautiful Lake</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Showcase</p>
    </footer>

</body>
</html>
