<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>

    <h1>Upload Image</h1>

    <form>

        <label for="file">Choose File:</label>

        <input type="file"
               id="file"
               name="file"
               accept=".jpg,.png">

        <br><br>

        <p>Only JPG and PNG image files are allowed.</p>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
