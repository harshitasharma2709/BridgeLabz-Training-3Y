<!DOCTYPE html>
<html>
<head>
  <title>Product Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* Product Card */
    .product-card {
      position: relative;
      width: 360px;
      margin: auto;
      background-color: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 20px gray;
    }

    /* Product Image Section */
    .image-section {
      position: relative;
      height: 330px;
      background-color: #e50914;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Discount Badge */
    .discount {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      background-color: red;
      color: white;
      border-radius: 25px;
      font-weight: bold;
      font-size: 18px;
    }

    /* Heart Button */
    .heart {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: white;
      text-align: center;
      line-height: 50px;
      font-size: 28px;
    }

    /* Product Details */
    .product-details {
      padding: 25px;
    }

    .category {
      color: #2867c7;
      font-size: 18px;
      font-weight: bold;
    }

    .product-name {
      margin: 10px 0;
      font-size: 27px;
      color: #222;
    }

    /* Rating */
    .rating {
      margin: 15px 0;
      font-size: 20px;
    }

    .stars {
      color: #f5c518;
      letter-spacing: 3px;
    }

    .reviews {
      color: gray;
      font-size: 16px;
    }

    /* Price */
    .price {
      margin: 15px 0;
    }

    .current-price {
      font-size: 30px;
      font-weight: bold;
      color: black;
    }

    .old-price {
      margin-left: 15px;
      color: gray;
      font-size: 20px;
      text-decoration: line-through;
    }

    /* Add to Cart Button */
    .cart-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background-color: black;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- Product Card -->
  <div class="product-card">

    <!-- Image Section -->
    <div class="image-section">

      <img
        class="product-image"
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
        alt="Red Sports Shoes"
      >

      <!-- Discount Badge -->
      <div class="discount">20% OFF</div>

      <!-- Heart Icon -->
      <div class="heart">♡</div>

    </div>

    <!-- Product Details -->
    <div class="product-details">

      <div class="category">SPORTS SHOES</div>

      <h2 class="product-name">Premium Running Shoes</h2>

      <!-- Rating -->
      <div class="rating">
        <span class="stars">★★★★★</span>
        <span class="reviews">(120)</span>
      </div>

      <!-- Price -->
      <div class="price">
        <span class="current-price">₹1,999</span>
        <span class="old-price">₹2,409</span>
      </div>

      <!-- Cart Button -->
      <button class="cart-button">Add to Cart</button>

    </div>

  </div>

</body>
</html>
